name: pricing-refresh

# Regenerates the embedded pricing snapshots from upstream sources on a schedule
# and opens a pull request with the diff. Estimation always runs against the
# committed snapshot, so this never touches the estimate hot path — it only
# proposes refreshed data for review.

on:
  schedule:
    # 06:00 UTC on the 1st of every month.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate pricing snapshots
        env:
          GCP_REGION: us-central1
          AWS_REGION: us-east-1
          AZURE_REGION: eastus
          GCP_CATALOG_URL: ${{ secrets.GCP_CATALOG_URL }}
          AWS_PRICELIST_URL: ${{ vars.AWS_PRICELIST_URL }}
          AZURE_RETAIL_URL: ${{ vars.AZURE_RETAIL_URL }}
        run: make refresh-pricing

      - name: Validate regenerated snapshots build and pass tests
        run: go test ./internal/pricing/... ./internal/estimate/...

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: pricing/auto-refresh
          commit-message: "chore(pricing): refresh embedded snapshots"
          title: "chore(pricing): refresh embedded pricing snapshots"
          body: |
            Automated pricing snapshot refresh generated by `pricing-gen`.

            - Regenerated from the GCP Cloud Billing Catalog, AWS Price List, and
              Azure Retail Prices sources.
            - Review the price diffs before merging; spot figures are indicative.
          labels: pricing, automated
          delete-branch: true
